<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>导入下载列表</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="animal-card">
      <h1>导入下载列表</h1>
      <p class="hint">请选择 TXT 或 JSON 格式的队列文件。导入策略可在设置页配置。</p>
      <button id="pick-btn" type="button" class="btn primary">选择文件</button>
      <input id="import-file" type="file" accept=".txt,.json,text/plain,application/json" hidden />
      <p id="status" class="status">正在打开文件选择器…</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
